openapi: 3.1.0
info:
  title: Fastify Regression Demo API
  version: 1.1.0
  description: Demonstration API candidate contract with breaking and compatible changes
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy service response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /users/{id}:
    get:
      summary: Fetch user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /billing/summary:
    get:
      summary: Get billing summary
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - currency
                properties:
                  total:
                    type: number
                    example: 42.5
                  currency:
                    type: string
                    example: USD
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - customerId
              properties:
                items:
                  type: array
                  items:
                    type: string
                customerId:
                  type: string
                notes:
                  type: string
                giftWrap:
                  type: boolean
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
  /config:
    get:
      summary: Service configuration
      parameters:
        - name: env
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Config details
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
  /secure/profile:
    get:
      summary: Protected user profile
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Protected profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  role:
                    type: string
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header
  schemas:
    UserProfile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
